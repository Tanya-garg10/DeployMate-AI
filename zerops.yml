zerops:
  # DeployMate AI - Zerops Production Deployment Specification
  # NioHack 2026 Theme 6
  - setup: app
    build:
      base: nodejs@20
      buildCommands:
        - npm install
        - npm run build
      deployFiles:
        - dist
        - package.json
        - node_modules
      cache:
        - node_modules
    run:
      base: nodejs@20
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        NODE_ENV: "production"
      start: node dist/server.cjs
      healthCheck:
        httpGet:
          port: 3000
          path: /health
